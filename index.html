    <meta name="description" content="India's grounded AI weather copilot with live Open-Meteo feeds, multi-model NWP ensembles, Gramin Krishi Mausam agro-advisories, and rural multi-channel emergency relay." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      // Clear legacy service worker caches to ensure fresh UI reload
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>

  </body>
